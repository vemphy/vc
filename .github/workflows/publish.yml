name: publish

# Publishing a GitHub release named vX.Y.Z publishes @vemphy/vc X.Y.Z to npm
# and tags the Go module as vc-go/vX.Y.Z, which is how the Go module proxy
# finds a module that lives in a subdirectory.
on:
  release:
    types: [published]

permissions:
  contents: write # to push the Go module tag
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: vc-go/go.sum

      - name: Version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "release tag must look like v1.2.3, got $TAG" >&2; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: (cd vc-go && go test ./...)
      - run: scripts/interop.sh

      - name: Publish to npm
        working-directory: packages/vc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          pnpm build
          pnpm publish --provenance --access public --no-git-checks

      - name: Tag the Go module
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "vc-go/v$VERSION"
          git push origin "vc-go/v$VERSION"
